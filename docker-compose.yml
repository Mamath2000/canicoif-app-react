# Déploiement type (même structure que la prod) :
#   - secret dans canicoif.env, non versionné : JWT_SECRET=<openssl rand -hex 32>
#   - `docker compose up -d` utilise l'image publiée ; `docker compose up -d --build` la construit depuis ce dossier
#   - MongoDB n'est pas publié sur l'hôte : seule l'app y accède, par le réseau Docker du projet
services:
  canicoif:
    container_name: canicoif
    image: mathmath350/canicoif:latest
    build:
      context: .
      args:
        - VITE_GIT_REF
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - path: canicoif.env
        required: false   # l'app refuse de démarrer sans JWT_SECRET
    environment:
      - MONGO_URI=mongodb://mongo:27017/canicoif
      - ANIMAUX_LIMIT=18
      - CLIENTS_LIMIT=18
      - TEST_BANNER=false
    depends_on:
      - mongo
    # healthcheck : défini dans le Dockerfile (fetch Node, pas de curl dans l'image)

  mongo:
    container_name: mongo
    image: mongo:8.2.7
    volumes:
      - ./mongo-data:/data/db
    restart: always
