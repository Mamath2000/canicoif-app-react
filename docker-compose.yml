services:
  canicoif:
    container_name: canicoif
    build:
      context: .
      args:
        - VITE_GIT_REF
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/canicoif
      - JWT_SECRET=${JWT_SECRET:-}   # requis : l'app refuse de démarrer sans (openssl rand -hex 32)
      - ANIMAUX_LIMIT=18
      - CLIENTS_LIMIT=18
      # - TEST_BANNER=false
    # VITE_GIT_REF sera injecté dynamiquement au build
    depends_on:
      - mongo
    # healthcheck : défini dans le Dockerfile (fetch Node, pas de curl dans l'image)

  mongo:
    container_name: mongo
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-data:/data/db
    restart: always